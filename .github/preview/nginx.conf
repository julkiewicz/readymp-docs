# Serves a Docusaurus build the way GitHub Pages serves the live site.
#
# The site sets `trailingSlash: false`, so most pages are written as `path.html` and linked as `/path`. `$uri.html`
# covers those, `$uri/` the folder-style pages and the locale roots, and anything else gets the site's own 404 page.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative, so they keep the preview's own host rather than nginx's idea of it.
    absolute_redirect off;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
